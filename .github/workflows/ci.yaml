name: CI

# 迁移自 .aoneci/ci.yaml：保持 lint / ut / e2e 三个 job 的语义一致。
# push 到 master、以及针对 master 的 pull_request 触发。
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  # 单元测试覆盖率下限（仅统计库包，examples 为薄 CLI 不计入）。
  MIN_COVERAGE: "90"
  # golangci-lint 版本与 Taskfile.yml / .golangci.yml 保持一致。
  GOLANGCI_LINT_VERSION: v1.64.8

jobs:
  # 统一格式与静态检查：gofmt 校验 + go vet + golangci-lint。
  go-sdk-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: gofmt / vet / golangci-lint
        run: |
          go version
          echo ">>> gofmt 格式校验..."
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件需要 gofmt，请本地运行 'task fmt'：" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo ">>> go vet..."
          go vet ./...
          echo ">>> golangci-lint..."
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@${GOLANGCI_LINT_VERSION} run ./...

  # 单元测试 + 覆盖率门槛（库包语句覆盖率必须 >= MIN_COVERAGE）。
  go-sdk-ut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: 单元测试与覆盖率
        run: |
          go version
          # 覆盖率只统计库包（根目录 package e2b），examples 是薄 CLI 无测试、不计入。
          go test -count=1 -v -covermode=count -coverprofile=coverage.out .
          echo ">>> 覆盖率明细："
          go tool cover -func=coverage.out | tail -1
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo ">>> 库包语句覆盖率：${coverage}%（下限 ${MIN_COVERAGE}%）"
          awk -v c="$coverage" -v t="$MIN_COVERAGE" 'BEGIN { if (c+0 < t+0) { printf "覆盖率 %s%% 低于下限 %s%%，请补充单元测试\n", c, t; exit 1 } }'

  go-sdk-e2e-singapore:
    runs-on: ubuntu-latest
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY_SINGAPORE }}
      E2B_API_URL: "https://api.ap-southeast-1.e2b.fc.aliyuncs.com"
      E2B_DOMAIN: "ap-southeast-1.e2b.fc.aliyuncs.com"
      E2B_E2E_TEMPLATE: "code-interpreter-v1"
      E2B_E2E_TIMEOUT_SECONDS: "900"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: E2E（新加坡）
        run: |
          go version
          if [ -z "$E2B_API_KEY" ]; then
            echo ">>> 未配置 E2B_API_KEY_SINGAPORE secret，跳过 E2E。"
            exit 0
          fi
          go run ./test/e2e
